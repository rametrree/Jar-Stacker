plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'IsXander Maven'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:26.1.2"
	implementation "net.fabricmc:fabric-loader:0.19.3"
	runtimeOnly "net.fabricmc.fabric-api:fabric-api:0.145.4+26.1.2"
	runtimeOnly "dev.isxander:yet-another-config-lib:3.9.6+26.1-fabric"
	runtimeOnly "com.terraformersmc:modmenu:18.0.1"
	def jarFile = file("${rootProject.projectDir}/versions/26.1/build/libs/jarstacker-0.7.0+mc26.1.jar")
	if (jarFile.exists()) {
		runtimeOnly files(jarFile)
	}
}

loom {
	runs {
		server {
			runDir = rootProject.file("run").path
		}
		client {
			runDir = rootProject.file("run").path
		}
	}
}

tasks.matching { it.name.startsWith("run") }.configureEach {
	if (project.hasProperty("runTests") || System.getProperty("jarstacker.test") != null) {
		systemProperty "jarstacker.test", "true"
	}
}

